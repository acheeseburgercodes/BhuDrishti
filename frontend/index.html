<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b1a1c'/%3E%3Cpath d='M4 21 11 11l4 5 4-7 9 12' fill='none' stroke='%23eef3ef' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M4 25c4-2 8 2 12 0s8-2 12 0' fill='none' stroke='%2356c2b4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Apply a stored theme choice before first paint (see src/lib/theme.jsx).
      try { var t = localStorage.getItem('bhudrishti.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t) } catch (e) {}
    </script>
    <meta name="description" content="BhuDrishti: community ESP32 and phone sensing for flood and glacial-lake outburst early warning on the Trishuli–Bhote Koshi corridor. Prototype, not a certified warning system." />
    <title>BhuDrishti · Community flood &amp; GLOF early-warning prototype</title>
  </head>
  <body>
    <noscript>BhuDrishti needs JavaScript to show live corridor data.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
